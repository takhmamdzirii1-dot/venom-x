name: Build flame assets RGBA + animated WebP
on:
  push:
    paths:
      - "scripts/build_fire_assets.py"
      - ".github/workflows/build-fire-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check pillow==11.3.0
      - name: Convert source sprite atlas into native CSP renderable assets
        run: python scripts/build_fire_assets.py
      - name: Commit generated textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/venom_flames_rgba_v3.png assets/venom_flames_loop_v3.webp
          if ! git diff --cached --quiet; then
            git commit -m "Render fire alpha textures: RGBA atlas and animated WebP"
            git push
          fi
