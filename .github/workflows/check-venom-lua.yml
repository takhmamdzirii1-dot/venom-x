name: Validate VENOM X Lua syntax
on:
  workflow_dispatch:
  push:
    paths:
      - 'VENOM_X.lua'
      - 'tests/car-options-regression.js'
      - '.github/workflows/check-venom-lua.yml'
jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua syntax parser
        run: npm install --no-save --silent luaparse@0.3.1 fengari@0.1.4
      - name: Parse CSP Lua source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const luaparse=require('luaparse');
          const source=fs.readFileSync('VENOM_X.lua','utf8');
          const ast=luaparse.parse(source, {luaVersion:'5.2',comments:false});
          if (!ast || ast.type!=='Chunk') process.exit(1);
          const removed = [
            'drawVisualSky', 'ensureSceneColorCorrection',
            'updateSceneColorCorrection', 'VISUAL_TIME_STOPS',
            'SCENE_LIGHT_STOPS', 'ac.addColorCorrection',
            '##vx_visual_mode', '##vxq_filter'
          ];
          const remnants = removed.filter(item => source.includes(item));
          if (remnants.length) throw Error('Legacy visual filters still present: '+remnants.join(', '));
          const preserved = [
            "ac.StructItem.key('VENOMX_SetTime')",
            'queueServerSky(true)', 'queueServerSky(false)',
            '##vx_personal_time', '##vxq_clock',
            'local function teleportToPlayer(p)',
            'local function drawSpeedometer()',
            'assets/venom_logo.webp'
          ];
          const missing = preserved.filter(item => !source.includes(item));
          if (missing.length) throw Error('Required VENOM functionality missing: '+missing.join(', '));
          console.log('VENOM X Lua syntax + real sky/no-filter regression checks passed ('+source.length+' bytes)');
          NODE
      - name: Run live-Lua car options regression tests
        run: node tests/car-options-regression.js
